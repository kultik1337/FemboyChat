# Сборка установщика для Windows.
#
# Перенеси этот файл в .github/workflows/ и запускай через вкладку Actions.
# Подробности — в DESKTOP.md.
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      # Кеш Rust сокращает повторную сборку с десятков минут до пары.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install

      # Иконки не хранятся в репозитории — они генерируются из icon.png.
      - run: npx tauri icon icon.png

      - run: npm run desktop:build

      - uses: actions/upload-artifact@v4
        with:
          name: FemboyChat-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/FemboyChat.exe
          if-no-files-found: error
