# Сборка установщика FemboyChat для Windows.
#
# Запускается на каждый пуш в main, вручную (Actions -> Build Windows EXE)
# или при пуше тега вида v1.0.3.
#
# Релиз выпускается сам. Признак выпуска — номер версии в package.json:
# если релиза с таким номером ещё нет, сборка ставит тег и публикует его
# вместе с установщиком. Если есть — просто собирает и ничего не трогает.
# Так выпуск версии не требует ни команд в терминале, ни кнопок в интерфейсе.
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      # Кеш Rust сокращает повторную сборку с десятков минут до пары.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Установить зависимости
        run: npm install

      # Иконки, графика установщика и installer.nsi не хранятся в репозитории:
      # они генерируются из icon.png скриптами в scripts/.
      - name: Сгенерировать иконки и графику установщика
        run: npm run desktop:icons

      - name: Собрать приложение и установщик
        run: npm run desktop:build

      - name: Выложить артефакты
        uses: actions/upload-artifact@v4
        with:
          name: FemboyChat-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/femboychat.exe
          if-no-files-found: error

      # Номер версии берётся из package.json, а не из имени ветки или тега:
      # это тот же источник, откуда версию берёт сборка установщика.
      - name: Определить версию и проверить, есть ли такой релиз
        id: rel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null 1>$null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Релиз $tag уже есть — публиковать нечего."
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Релиза $tag нет — будет создан."
          }
          exit 0

      # Создаёт и тег, и релиз на текущем коммите.
      - name: Выпустить релиз с новой версией
        if: github.ref == 'refs/heads/main' && steps.rel.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: FemboyChat ${{ steps.rel.outputs.tag }}
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true

      # Запасной путь: тег поставили руками.
      - name: Прикрепить установщик к Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
