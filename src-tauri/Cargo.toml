[package]
name = "femboychat"
version = "1.0.2"
description = "FemboyChat — десктопное приложение"
authors = ["kultik1337"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Размер и положение окна запоминаются между запусками.
tauri-plugin-window-state = "2"
# Второй запуск не плодит копию, а поднимает уже открытое окно.
tauri-plugin-single-instance = "2"

# Установщик скачивают руками, поэтому размер важнее последних процентов
# скорости: вся тяжелая работа всё равно идёт в WebView.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
